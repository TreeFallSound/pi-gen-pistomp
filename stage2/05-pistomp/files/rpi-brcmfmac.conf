# Shadow the distro file of the same name (/usr/lib/modprobe.d/rpi-brcmfmac.conf,
# shipped by raspi-firmware since the Bookworm cycle) which sets roamoff=1.
# kmod shadows per-file: a same-basename file in /etc/modprobe.d/ replaces the
# /usr/lib one entirely, so this is the only brcmfmac line read at module load.
#
# Why roamoff=0: soak-tested 2026-08-25 on an AP/band-steering mesh (Bell Whole
# Home). With roamoff=1, wpa_supplicant bgscan re-associated to a "better" BSSID
# roughly every 12 min, restarting DHCP and dropping the link as seen from the
# network. With firmware roaming enabled (roamoff=0), the link stayed put for
# the 24-min soak window with zero reassociations. feature_disable is kept at
# the distro's value (0x282000) so this change touches only the roam decision.
options brcmfmac roamoff=0 feature_disable=0x282000
