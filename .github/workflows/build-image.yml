name: build-image

# Builds the full pistompOS SD-card image.
#
# Triggers ONLY on:
#   - a pushed tag matching `release/<version>`, which publishes a GitHub
#     Release with the image attached. The tag suffix picks the track:
#
#       tag                  track    apt suites             GitHub Release
#       release/3.4.0        stable   trixie                 normal
#       release/3.4.0-rc1    rc       trixie                 prerelease
#       release/3.4.0-pre1   testing  trixie+trixie-testing  prerelease
#
#     -testing, -beta and -alpha are testing markers too. An rc image installs
#     the same packages as the stable release it precedes; that is the point of
#     having it. A prerelease stays out of releases/latest.
#   - manual dispatch — produces a workflow artifact only (no release)
#
# Per-package OTA releases (tagged debpkg/<pkg>/<ver>) do NOT trigger this.
on:
  workflow_dispatch:
  push:
    tags:
      - 'release/*'

jobs:
  build:
    # Native arm64 runner: the build runs in an arm64 container, so no QEMU /
    # binfmt cross-arch shim is needed (build-docker.sh skips it on aarch64).
    runs-on: ubuntu-24.04-arm
    outputs:
      image_version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      track: ${{ steps.version.outputs.track }}
      prerelease: ${{ steps.version.outputs.prerelease }}

    steps:
    - name: Clean Workspace Folder
      run: |
        rm -rf ./* || true
        rm -rf ./.??* || true

    - uses: actions/checkout@v4
      with:
        fetch-depth: 1
        clean: true

    - name: Determine image version
      id: version
      run: |
        if [[ "${GITHUB_REF}" == refs/tags/release/* ]]; then
          VERSION="${GITHUB_REF#refs/tags/release/}"
          # Verbatim, prefix included: the manifest download URL is built from it.
          TAG="${GITHUB_REF#refs/tags/}"
        else
          VERSION="dev-$(git rev-parse --short HEAD)"
          # Dispatch publishes no release, so don't invent a release/ path.
          TAG="${VERSION}"
        fi

        # One track drives all three decisions below. rc is a prerelease built
        # from stable packages; only testing pulls in the trixie-testing suite.
        if [[ "${VERSION}" =~ -rc[0-9]*$ ]]; then
          TRACK=rc
        elif [[ "${VERSION}" =~ -(testing|pre|beta|alpha)[0-9]*$ ]]; then
          TRACK=testing
        else
          TRACK=stable
        fi

        if [ "${TRACK}" = stable ]; then PRERELEASE=false; else PRERELEASE=true; fi
        if [ "${TRACK}" = testing ]; then CHANNEL=testing; else CHANNEL=stable; fi

        echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
        echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
        echo "track=${TRACK}" >> "$GITHUB_OUTPUT"
        echo "prerelease=${PRERELEASE}" >> "$GITHUB_OUTPUT"
        echo "channel=${CHANNEL}" >> "$GITHUB_OUTPUT"
        echo "Image version: ${VERSION} (track: ${TRACK}, apt channel: ${CHANNEL})"

    # Gate: the image installs custom packages from the published apt repo, so a
    # package whose upstream has moved past its last release would silently ship
    # stale. Fail the build (exit 2) until the missing .deb release is cut.
    # WARN states (no release / no sidecar yet) are non-fatal and pass through.
    - name: Staleness gate (fail on STALE)
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: ./scripts/check-upstream-staleness.sh

    # fail fast on a missing kernel release
    - name: Kernel release pre-flight
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        source ./config.sh
        TAG="kernel/${KERNEL_DEB_VERSION}"
        if gh release view "${TAG}" >/dev/null 2>&1; then
          echo "OK: ${TAG} is published."
        else
          echo "::error::No GitHub Release ${TAG} — the image build would fail in fetch-assets.sh."
          echo "Run the build-kernel workflow (Actions -> build-kernel -> Run workflow), or"
          echo "build locally with ./build-rt-kernel-docker.sh and publish the release it prints."
          exit 1
        fi

    - name: Run build-docker.sh
      env:
        IMG_VERSION: ${{ steps.version.outputs.version }}
        IMG_CHANNEL: ${{ steps.version.outputs.channel }}
      run: ./build-docker.sh

    - name: Compress image
      run: ./compress-img.sh

    - name: Generate Imager 2.x JSON manifest
      run: |
        XZ_FILE=$(ls deploy/*pistompOS*.img.xz | head -1)
        ./scripts/generate-imager-manifest.sh "$XZ_FILE" "${{ steps.version.outputs.tag }}"

    - name: List output files
      run: ls -lh deploy pistomp-imager-manifest.json

    - name: Upload built image
      uses: actions/upload-artifact@v4
      with:
        name: pistompOS
        path: ./deploy/*pistompOS*.img.xz
        compression-level: 0
        if-no-files-found: error

    - name: Upload Imager manifest
      uses: actions/upload-artifact@v4
      with:
        name: imager-manifest
        path: ./pistomp-imager-manifest.json
        if-no-files-found: error

    - name: Upload debug artifacts
      uses: actions/upload-artifact@v4
      with:
        name: debug-files
        path: |
          ./deploy/*pistompOS*.info
          ./deploy/*build*.log
        compression-level: 6
        if-no-files-found: error

  release:
    # Only publish a Release for `release/<version>` tag pushes, never for
    # manual dispatch (whose github.ref is a branch).
    if: startsWith(github.ref, 'refs/tags/release/')
    needs: [build]
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: write
    steps:
      # The Release body is the annotated tag's message, so the notes are
      # written and reviewed at the moment the release is cut and travel with
      # the tag itself. Cut the tag with:
      #
      #   git tag -a --cleanup=verbatim release/<ver> -F <notes.md>
      #   git push origin release/<ver>
      - uses: actions/checkout@v4
        with:
          # The tag object's message is not in a shallow ref-only checkout.
          fetch-depth: 0
          fetch-tags: true
      - name: Release notes from the tag annotation
        env:
          TAG: ${{ needs.build.outputs.tag }}
        run: |
          git tag -l --format='%(contents)' "${TAG}" > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "::error::${TAG} carries no annotation message — re-cut it with 'git tag -a ${TAG} -F <notes.md> -f' and force-push the tag."
            exit 1
          fi
          cat release-notes.md
      - uses: actions/download-artifact@v4
        with:
          name: pistompOS
          path: release-assets/
      - uses: actions/download-artifact@v4
        with:
          name: imager-manifest
          path: release-assets/
      - uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          body_path: release-notes.md
          # rc and testing tracks are prereleases, kept out of releases/latest.
          prerelease: ${{ needs.build.outputs.prerelease == 'true' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deploy-manifest:
    # Deploy the Imager manifest to gh-pages:
    #   imager/pistomp-<track>.json    — one pointer per track (stable/rc/testing)
    #   imager/pistomp-<version>.json  — per-version archival snapshot
    #   imager/pistomp.json            — legacy URL, a third copy of stable. The
    #                                    README has published it for a long time;
    #                                    deleting it 404s every configured Imager.
    # needs: [build, release] so the manifest strictly trails a real public
    # release. A manifest published without one points Imager at a 404.
    if: startsWith(github.ref, 'refs/tags/release/')
    needs: [build, release]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
          fetch-depth: 1
      - uses: actions/download-artifact@v4
        with:
          name: imager-manifest
          path: imager/
      # The icon lives on the source branch (site/imager/), which the gh-pages
      # checkout above does not contain. Check the tagged source out to a side
      # path so the deploy step can copy it across.
      - uses: actions/checkout@v4
        with:
          path: src
          fetch-depth: 1
      - name: Deploy track and version-pinned manifests
        env:
          TRACK: ${{ needs.build.outputs.track }}
          IMG_VERSION: ${{ needs.build.outputs.image_version }}
        run: |
          cp imager/pistomp-imager-manifest.json "imager/pistomp-${IMG_VERSION}.json"
          cp imager/pistomp-imager-manifest.json "imager/pistomp-${TRACK}.json"
          if [[ "${TRACK}" == "stable" ]]; then
            cp imager/pistomp-imager-manifest.json imager/pistomp.json
          fi
          # Don't commit the raw downloaded artifact into gh-pages.
          rm -f imager/pistomp-imager-manifest.json

          # Publish the icon the manifest points at. Unconditional so a changed
          # icon redeploys; `git diff --cached --quiet` below skips the commit
          # when it is byte-identical to what is already on gh-pages.
          cp src/site/imager/icon.png imager/icon.png
          rm -rf src

          git config user.name "pistomp-bot"
          git config user.email "bot@treefallsound.com"
          git add imager/
          if git diff --cached --quiet; then
            echo "No changes to gh-pages."
          else
            git commit -m "deploy imager manifest for ${IMG_VERSION} → ${TRACK} [skip ci]"
            # publish-apt-repo.yml (triggered by the release job) also pushes
            # gh-pages, so a plain push can be rejected non-fast-forward. Retry
            # on top of whatever landed meanwhile. The commit must exist before
            # rebasing — `git pull --rebase` aborts outright on a dirty index
            # ("cannot pull with rebase: Your index contains uncommitted
            # changes"), which is why the commit comes first.
            for attempt in 1 2 3; do
              if git push origin HEAD:gh-pages; then
                exit 0
              fi
              echo "push rejected (attempt ${attempt}); rebasing onto origin/gh-pages"
              git fetch origin gh-pages
              git rebase origin/gh-pages || { git rebase --abort || true; exit 1; }
            done
            echo "::error::could not push manifest to gh-pages after 3 attempts"
            exit 1
          fi
