# Per-package workflow — see docs/package-template/build.yml.
name: build-pistomp-wifi

on:
  push:
    branches: [main]
    paths:
      - 'debpkgs/pistomp-wifi/**'
  pull_request:
    paths:
      - 'debpkgs/pistomp-wifi/**'
  workflow_dispatch:

jobs:
  build:
    uses: ./.github/workflows/build-deb.yml
    with:
      pkg: pistomp-wifi
    secrets: inherit
