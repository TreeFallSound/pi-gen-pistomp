# /etc/default/rtirq — pi-Stomp realtime IRQ tuning (Raspberry Pi 5)
#
# Read by the rtirq init script, which rtirq.service runs on a Pi 5 via
# pistomp-audio-irq.py (on a Pi 2/3/4 the resolver sets priorities itself
# and does not read this file). Only effective with threadirqs (on
# cmdline) or a PREEMPT_RT kernel.
#
# IRQ thread service names (space separated, highest to lowest priority).
# Pi 5: dw_axi_dmac_platform — the RP1 DMA controller. The IQaudio DAC+ is
#       fed through RP1 DMA, and the IRQ thread is named after the
#       controller, NOT the sound driver. On the other two names: "snd"
#       never matches (it greps /proc/asound/cards for "irq", which only
#       PCI sound cards write) and "snd-usb" never matches either (it
#       looks for that literal text in /proc/interrupts, but Raspberry Pi
#       USB interrupts are labelled "xhci-hcd").
#
# External USB sound cards (pistomp.conf JACK_DEVICE) are a known gap. Their
# host-controller IRQ threads stay at 50 (Pi 5/4: "irq/N-xhci-hcd:usbK";
# Pi 3: "irq/N-dwc2_hsotg"), below jackd. Raising them by name here is wrong:
# the label depends on the board, and it would put USB storage, wifi and MIDI
# above audio on every unit that uses the onboard card. The resolver-style fix
# is conditional on JACK_DEVICE naming a snd-usb-audio card; implement it only
# if a USB-card user reports xruns.
# grep -c . /proc/interrupts; ps -eo rtprio,comm | grep irq/
RTIRQ_NAME_LIST="dw_axi_dmac_platform"

# Highest priority assigned to the first name in the list.
RTIRQ_PRIO_HIGH=90

# Priority decrease step between each subsequent name.
RTIRQ_PRIO_DECR=1

# Lowest priority floor.
RTIRQ_PRIO_LOW=51

# Whether to reset all IRQ threads to SCHED_OTHER first.
RTIRQ_RESET_ALL=0

# On kernel configurations that support it, which services should
# NOT be threaded. Empty — we want everything threaded (threadirqs
# on cmdline handles this).
RTIRQ_NON_THREADED=""

# Process names forced to highest realtime priority range (99-91).
# Unset — timer IRQ is already high priority by default.
#RTIRQ_HIGH_LIST="timer"
