# pi-stomp: -E activates bluez's BLE-MIDI GATT plugin (an experimental
# profile); without it no ALSA seq port is ever created and pairing a MIDI
# device silently produces nothing. The Pi 5 BT radio boots rfkill
# soft-blocked, which otherwise leaves the adapter PowerState=off-blocked.
#
# This grants capability only. Whether bluetooth.service runs at all is
# pi-Stomp's to decide at runtime; nothing here enables or starts it.
[Service]
ExecStartPre=-/bin/sh -c 'for f in /sys/class/rfkill/*; do [ "$(cat $f/type)" = bluetooth ] && echo 0 > $f/soft; done'
ExecStart=
ExecStart=/usr/libexec/bluetooth/bluetoothd -E
